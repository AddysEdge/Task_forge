name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          # Caches ~/.m2/repository keyed on pom.xml.
          cache: maven

      - name: Show Docker version
        # Integration tests run PostgreSQL, Redis and Kafka through Testcontainers,
        # which needs the runner's Docker daemon. Recorded here so an API-version
        # mismatch is obvious in the log rather than a mystery test failure.
        run: docker version

      - name: Compile
        run: ./mvnw -B -ntp clean compile

      - name: Unit tests
        run: ./mvnw -B -ntp test

      - name: Integration tests and package
        # verify runs the *IT classes through failsafe and then builds the jar.
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        # Reports are most valuable exactly when the build failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: taskforge-jar
          path: target/taskforge-*.jar
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: taskforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
